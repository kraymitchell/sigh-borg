<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3600">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://sigh-borg.com; connect-src https://docs.google.com https://*.googleusercontent.com; img-src https://sigh-borg.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Sigh-borg</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #e97e2c, #D96A15);
    }

    .sep {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    .setup   { color: #FAFAF8; font-weight: bold; }
    .punchline { color: #E8DCC8; }
    .single  { color: #FAFAF8; font-weight: bold; }
    .muted   { color: rgba(232,220,200,0.55); }

    /* Default: small layout visible */
    .medium-layout, .large-layout { display: none; }

    /* ===================== SMALL (default / ≤175px wide) ===================== */
    .small-layout {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 12px;
    }

    .small-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .logo-sm {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
    }

    .small-site { font-size: 9px; }

    .small-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
      min-height: 0;
    }

    .small-body .setup {
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .small-body .punchline {
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .small-body .single {
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
    }

    /* ===================== MEDIUM (≥176px wide, ≤175px tall) ===================== */
    @media (min-width: 176px) and (max-height: 175px) {
      .small-layout  { display: none; }
      .large-layout  { display: none; }

      .medium-layout {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
        padding: 14px;
      }

      .logo-md {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        object-fit: cover;
      }

      #medium-joke {
        height: 100%;
        padding-right: 52px;
        padding-bottom: 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
      }

      .medium-layout .setup {
        font-size: 14px;
        line-height: 1.4;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .medium-layout .punchline {
        font-size: 14px;
        line-height: 1.4;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .medium-layout .single {
        font-size: 14px;
        line-height: 1.4;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }

      /* Hide the in-joke separator in medium — gap handles spacing */
      #medium-joke .joke-sep { display: none; }

      .medium-footer {
        position: absolute;
        bottom: 14px;
        left: 14px;
        font-size: 10px;
      }
    }

    /* ===================== LARGE (≥176px wide, ≥176px tall) ===================== */
    @media (min-width: 176px) and (min-height: 176px) {
      .small-layout  { display: none; }
      .medium-layout { display: none; }

      .large-layout {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 16px;
      }

      .large-header {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .logo-lg {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .large-title { display: flex; flex-direction: column; gap: 2px; }

      .large-name {
        color: #FAFAF8;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.2;
      }

      .large-tagline { font-size: 12px; line-height: 1.2; }

      .large-layout .sep { margin: 10px 0; }

      .large-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        overflow: hidden;
        min-height: 0;
      }

      /* Hide the in-joke separator in large — gap handles spacing */
      #large-joke .joke-sep { display: none; }

      .large-layout .setup {
        font-size: 16px;
        line-height: 1.6;
        text-align: center;
        overflow: visible;
        display: block;
      }

      .large-layout .punchline {
        font-size: 16px;
        line-height: 1.6;
        text-align: center;
        overflow: visible;
        display: block;
      }

      .large-layout .single {
        font-size: 16px;
        line-height: 1.6;
        text-align: center;
        overflow: visible;
        display: block;
      }

      .large-footer {
        font-size: 10px;
        text-align: center;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>

  <!-- SMALL -->
  <div class="small-layout">
    <div class="small-header">
      <img class="logo-sm" src="https://sigh-borg.com/images/logo-sigh-borg.jpg" alt="" aria-hidden="true" width="28" height="28">
      <span class="muted small-site">sigh-borg.com</span>
    </div>
    <div class="small-body" id="small-joke"></div>
  </div>

  <!-- MEDIUM -->
  <div class="medium-layout">
    <img class="logo-md" src="https://sigh-borg.com/images/logo-sigh-borg.jpg" alt="" aria-hidden="true" width="36" height="36">
    <div id="medium-joke"></div>
    <span class="medium-footer muted">sigh-borg.com</span>
  </div>

  <!-- LARGE -->
  <div class="large-layout">
    <div class="large-header">
      <img class="logo-lg" src="https://sigh-borg.com/images/logo-sigh-borg.jpg" alt="" aria-hidden="true" width="44" height="44">
      <div class="large-title">
        <span class="large-name">Sigh-borg</span>
        <span class="muted large-tagline">Your daily groan</span>
      </div>
    </div>
    <div class="sep"></div>
    <div class="large-content" id="large-joke"></div>
    <div class="sep"></div>
    <div class="large-footer muted">Tap to visit &middot; sigh-borg.com</div>
  </div>

  <script>
  (function () {
    'use strict';

    var CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRN5G-aBP45cQyt3m2Ojt5YDi7FdG56-vkmsftv5AnA4KoF17LzD9g1VtTKZOJRGX-HoukZCLxpkP4F/pub?output=csv';

    function parseCSV(csv) {
      var jokes = [];
      var lines = csv.split('\n');
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        if (line.charAt(0) === '"' && line.charAt(line.length - 1) === '"') {
          line = line.slice(1, -1).replace(/""/g, '"');
        }
        if (line) jokes.push(line);
      }
      return jokes;
    }

    function formatJoke(text) {
      if (!text || typeof text !== 'string') return { hasBreak: false, text: '' };
      var normalized = text.trim().replace(/\.\.\.+/g, '…');
      if (normalized.indexOf('…') !== -1) {
        var parts = normalized.split('…');
        var setup = parts[0].trim() + '…';
        var punchline = parts.slice(1).join('…').trim();
        if (punchline) return { hasBreak: true, setup: setup, punchline: punchline };
      }
      var qMatch = normalized.match(/^(.+?\?)(\s+|$)([\s\S]*)/);
      if (qMatch && normalized.indexOf('?"') === -1 && normalized.indexOf('?…') === -1) {
        var answer = qMatch[3].trim();
        if (answer) return { hasBreak: true, setup: qMatch[1].trim(), punchline: answer };
      }
      return { hasBreak: false, text: normalized };
    }

    function renderInto(joke, id) {
      var el = document.getElementById(id);
      if (!el) return;
      while (el.firstChild) el.removeChild(el.firstChild);

      if (joke.hasBreak) {
        var s = document.createElement('p');
        s.className = 'setup';
        s.textContent = joke.setup;

        var hr = document.createElement('div');
        hr.className = 'sep joke-sep';

        var p = document.createElement('p');
        p.className = 'punchline';
        p.textContent = joke.punchline;

        el.appendChild(s);
        el.appendChild(hr);
        el.appendChild(p);
      } else {
        var q = document.createElement('p');
        q.className = 'single';
        q.textContent = joke.text;
        el.appendChild(q);
      }
    }

    function showError(msg) {
      ['small-joke', 'medium-joke', 'large-joke'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        while (el.firstChild) el.removeChild(el.firstChild);
        var p = document.createElement('p');
        p.className = 'setup';
        p.textContent = msg;
        el.appendChild(p);
      });
    }

    function init() {
      fetch(CSV, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('bad status');
          return res.text();
        })
        .then(function (csv) {
          if (typeof csv !== 'string' || !csv.trim()) throw new Error('empty');
          var jokes = parseCSV(csv);
          if (!jokes.length) throw new Error('none');
          var joke = formatJoke(jokes[Math.floor(Math.random() * jokes.length)]);
          renderInto(joke, 'small-joke');
          renderInto(joke, 'medium-joke');
          renderInto(joke, 'large-joke');
        })
        .catch(function () {
          showError('Couldn’t load a joke.');
        });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  }());
  </script>
</body>
</html>
